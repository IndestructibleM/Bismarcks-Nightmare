 RedGer.1.t: "Kautsky Announces Retirement by Year's End"
 RedGer.1.d: "News comes from Berlin that the leader of Germany, Karl Kautsky, has officially announced his resignation from the central governing council by the end of the year. The reason given is Kautsky's advancing age and the increasing difficulties of governing a country at such an age. \n\nKarl Kautsky was known as the "Pope of Marxism." His orthodox and centrist approach to Marxism served as a guiding light for many within Germany. With his resignation, however, this faction of the SDAP (Social Democratic Workers' Party) appears to be coming to an end. His likely successor, Paul Levi, has refused to run against the "Red Prince" of the party and Kautsky's most likely successor, Karl Liebknecht. Levi's decision appears motivated by a desire to preserve unity within the party, which in recent years has become increasingly divided between reformist and radical factions. This division was further deepened by the departure of prominent reformist leader Eduard Bernstein, who left the party for the ADAV (All-German Workers' Association). \n\nLiebknecht himself formed his own faction within the SDAP, the Spartacists, in the wake of the Silesian War in 1916. The faction advocates more radical Marxist reforms than Kautsky's orthodox wing, particularly in foreign policy. The Spartacists argue that the German Revolution must be aggressively spread abroad. \n\nWith the orthodox faction of the SDAP effectively withdrawing from the succession struggle, a question now hangs over both the party and the country: does Germany truly desire the radical course that Karl Liebknecht promises? Or is this the chance for others to step into the gap left by Kautsky's resignation?"
 RedGer.1.a: "The Councils Begin to Murmur"

