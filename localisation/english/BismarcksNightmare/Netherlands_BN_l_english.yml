 # Republic Spirits
 NLD_eel_riot_legacy:0 "Legacy of the Eel Riot and the Orange Fury"
 NLD_eel_riot_legacy_desc:0 "How a game of eel-pulling could end in a revolution is one of the stranger facts of the late Victorian era, but it is true. When the police stopped the game by cutting the rope, a riot broke out that left 26 dead and many more wounded. The right accused the socialists of causing the chaos, or at least of using it for their revolutionary plot, and when socialists began mocking the King, an Orange Fury swept through Amsterdam and other cities. Mobs assaulted socialists and destroyed their property while the police did nothing. Apparently even an eel deserved more protection than a citizen, yet it was the socialist leader Ferdinand Domela Nieuwenhuis who went to jail for insulting the King.\n\nWhen he came out, he founded the Amsterdam Commune in the Jordaan and called on others to set up communes in their own cities and towns. Worn down by the Unemployment Crisis, the Suffrage Crisis, the Agricultural Crisis and the School Struggle, many did, and so began the Dutch Revolution."
 NLD_railways_and_canals:0 "Full of Railways and Canals, but Barely any Factories"
 NLD_railways_and_canals_desc:0 "As a trading nation, our focus was never industrialisation but transport and trade. We invested heavily in railways, roads and canals, but far less in factories."
 NLD_whos_in_charge:0 "Who's in Charge Here?"
 NLD_whos_in_charge_desc:0 "Our first leader, Ferdinand Domela Nieuwenhuis, was very sympathetic to the anarchist cause, and he based much of our "Polder Socialism" (sometimes jokingly called "Eel Socialism") on anarchist principles, allowing cities and towns to form autonomous communes.\n\nThe result is a spider's web of autonomous bodies where nobody knows who answers to whom. Some regions fall under several of them, and some under none at all."
 NLD_german_support:0 "German Support"
 NLD_german_support_desc:0 "Germany supported us during our revolution and has helped rebuild our army and economy. This also means we share many of its traits: our army is as democratic as theirs, our economy just as isolated, and part of our population sees us as nothing more than German puppets."

 # Kingdom Spirits
 HOL_beloved_queen:0 "Beloved Queen"
 HOL_beloved_queen_desc:0 "Riots, crises and personal scandals made the "Gorilla King" Willem III unloved, if not outright hated, by the general populace. With his death came his daughter, Queen Wilhelmina, who is beloved by the public and even liked by many in the Republic."
 HOL_illegitimate_state:0 "Illegitimate State"
 HOL_illegitimate_state_desc:0 "Even though we are the legitimate rulers of the Netherlands, nobody treats us as such. To most we are a puppet, or even just a military outpost of the French Empire, and this has cost us many political and economic opportunities.\n\n§YThis spirit is removed once we hold Noord-Holland and Zuid-Holland again.§!"
 HOL_bankrupt_army:0 "A Bankrupt Army with a State"
 HOL_bankrupt_army_desc:0 "Our return to The Hague and Amsterdam is our greatest goal, so we pour everything into the armed forces, and with French support we have a fine army...\n\nBut in exile our trade profits have dried up. We depend heavily on the Dutch East Indies to fill our coffers, and any instability there hits us hard."
 HOL_protestant_vs_catholics:0 "Protestants versus Catholics"
 HOL_protestant_vs_catholics_desc:0 "Our ruling class is made up of northern Protestants, yet the people of our exiled state are southern Catholics. This causes constant friction: some of our leaders have made insensitive remarks about the native Catholics, and the Catholic priests, while reluctantly supporting our cause, lobby against us to our French benefactors."
