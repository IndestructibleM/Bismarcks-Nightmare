l_english:

 polska.1.t: "The Polish Revolution!"
 polska.1.d: "The situation in Poland has totally escalated beyond Moscow's control! Protests and strikes have overtaken the country, and Pilsudski has returned to Poland - sent into it by the Germans - and siezed control of all of Warsaw in less than an hour upon arrival. Poland is breaking free as Polish cities overthrow their governments and rally with the new Warsaw government. The time to act is near."
 polska.1.a: "How will this effect the perogi market?"
 