l_english:

 polska.1.t: "The Polish Revolution!"
 polska.1.d: "The situation in Poland has totally escalated beyond the Russian's control. Protests and strikes have overtaken the country, and Pilsudski took control of all of Warsaw in less than an hour upon arrival. Poland is breaking free - and Marshal Jozef Pilsudski is at the helm of the revolution."
 polska.1.a: "How will this effect the perogi market?"
 