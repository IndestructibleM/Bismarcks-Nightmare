l_english:

 BUL_bn_imro:0 "The IMRO"
 BUL_bn_imro_desc:0 "The constant fratricidal crimes committed by the Internal Macedonian Revolutionary Organization have seriously damaged our international relations and led in 1924 to the military crackdown of the IMRO stronghold in Petrich, dealing a critical blow to the organization and forcing most of their leaders to flee abroad. However, some revolutionary cells are still active in Bulgaria, and most of our diplomatic relations remain in a poor state."
 BUL_bn_first_national_catastrophe:0 "The First National Catastrophe"
 BUL_bn_first_national_catastrophe_desc:0 "Following our defeat in the Second Balkan War, the Treaty of Bucharest forced us to cede vast territories that now belong to Serbia, Greece and Romania, and until recently the Balkan League required us to prioritise the payment of large sums of war reparations, crippling our economy and inevitably increasing the debt of our country. The national spirit has never truly recovered from this blow, so it is no wonder this treaty is popularly known in Bulgaria as the First National Catastrophe..."
 BUL_bn_prussia_of_the_balkans:0 "Prussia of the Balkans"
 BUL_bn_prussia_of_the_balkans_desc:0 "Ever since our nation won its independence from the Ottomans in 1878, it has been called the Prussia of the Balkans for its industrial and military might. We may have suffered a major defeat in 1913, but the title never left us, and we are still feared by our neighbours."
 BUL_bn_political_violence:0 "Political Violence"
 BUL_bn_political_violence_desc:0 "After our defeat by our neighbours in 1913, many governments tried to fix the nation, but all of them failed. Stamboliyski became the leader of the country in 1921 through his famous coup. But not all of the people agree with Stamboliyski's leftist wing, especially the supporters of the Democratic Alliance, who attack civilians and terrorise the streets."
