l_english:

 GER_socialism_military: "Democratic Army Organization"
 GER_socialism_military_desc: "The socialism revolution was born from workers and soldiers councils; those councils are the backbone of the republic. One of the promises to the soldiers' councils is autonomy to choose their own leaders, which caused a rapid spread of new doctrines, experience, and generally a high morale. But also caused indecisiveness, slow reaction, and infighting. This gets worse when the self-defence militias are taken into account, who are organized to defend the republic and thus has it’s own councils and their own infrastructure to support them, separate from the professional soldiers."
 GER_socialism_turnismo: "The Socialist Turnismo"
 GER_socialism_turnismo_desc: "In the political councils of the Republic, there are effectively two parties: The Social Democratic Workers' Party (SDAP) and the General German Workers' Association (ADAV). That’s because all others are either passively dismissed as too bourgeois and un-German or are actively worked against by state actors from the SDAP and ADAV. This effectively creates a Socialist Turnismo where only the SDAP and ADAV can lead and form coalitions, often only with each other."
 GER_struggle_for_republic: "Struggle for the Soul of the Republic"
 GER_struggle_for_republic_desc: "Our republic, the German Republic, is a mix between Socialism and Liberals, Nationalism and Internationalism, Councilism and State Power. This makes for a rich political landscape in the many political councils in our republic. But this also causes much political strife between the factions, and with the Socialist Turnismo that barred liberals and nationalists from higher office, the lower councils become a battleground of regret and revenge where each side tries to undermine each other more often than work together."
 GER_foreign_isolation: "Foreign Isolation"
 GER_foreign_isolation_desc: "From revolution, the German Republic is born, to spread revolution, it’s her goal. Germany backed plenty of socialism, Marxist, and even nationalist, liberal, and anarchist groups hostile to its enemies. But this also caused our republic to be isolated from foreign powers."
 GER_kulturkampf:0 "Der Kulturkampf"
 GER_kulturkampf_desc:0 "Officially, our state is secular, recognizing no god. But in practice, atheistic, materialistic, and Marxist ideology is pushed by the state, as it tries to dismantle the rights and privileges of organized religion until it’s slowly put under the might of the state, and no longer independent from it. This causes much friction with both the protestant and catholic churches in Germany, who resist this "Culture Struggle"."
 
