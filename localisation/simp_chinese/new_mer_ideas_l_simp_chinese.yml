 IRE_free_state_idea_desc:0 "《爱尔兰自由宪法》（§CBunreacht Shaorstát Éireann§!）确立了君主立宪制下的议会政体，并包含对某些基本权利的保障。该宪法本被设计为刚性宪法——在初始阶段过后，任何修宪动议均须经由全民公投方可生效。然而，由于宪法修正程序本身屡经修改，所有修正案最终仅需奥伊雷achtas（议会）简单通过法案即可成立。若能巧妙运筹帷幄，独立大业便如探囊取物。"
